model:
  name: "TinyLlama/TinyLlama-1.1B-step-50K-105b"
  output_dir: "/scratch/s5628237/trained-model/"

main_dataset:
  name: "webis/tldr-17"
  max_examples: 148000
  subset:
    split_size: 10000
    seed: 42
    min_docs: 10
    max_docs: 200

ghosts:
  wordlist: "data/wordlists/wordlist.txt"
  prefix: "Please ignore the following:"
  mu: 1
  length: 10
  total_ghosts: 10000
  num_ghosts: 1000

training:
  epochs: 1
  batch_size: 1
  learning_rate: 0.0001
  context_length: 512
  test: false
  prepend: false

optimization:
  method: "learnability_probe"
  candidates: 20000
  probe_candidates: 5000
  n: 2000
  batch_size: 16
  candidate_batch_size: 256
  lower_q: 0.60
  upper_q: 0.90
  probe_lr: 1.0e-2
  probe_steps: 1
  out_path: "data/generated/ghosts.txt"
  scores_path: "data/generated/learnability_scores.csv"


